<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
  <title>Swell Spectrum</title>
  <meta name="description" content="Latest CDIP buoy directional wave spectrum as a polar plot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
</head>
<body>
  <main>
    <section id="summary" class="summary" aria-live="polite">
      <h1 id="station-name">&nbsp;</h1>
      <label id="station-fallback" class="station-fallback" hidden>
        <span class="visually-hidden">Station</span>
        <select id="station-select"></select>
      </label>
      <p id="times" class="times"></p>
      <div id="stale" class="stale" hidden></div>
      <div id="status" class="notice" role="status" hidden>
        <p id="status-text"></p>
        <button id="retry" type="button" hidden>Try again</button>
      </div>
      <dl class="stats">
        <div><dt><span class="long">Wave </span>height</dt><dd id="hs">&nbsp;<small>&nbsp;</small></dd></div>
        <div><dt><span class="long">Peak </span>period</dt><dd id="tp">&nbsp;<small>&nbsp;</small></dd></div>
        <div><dt><span class="long">Peak </span>direction</dt><dd id="dp">&nbsp;<small>&nbsp;</small></dd></div>
      </dl>
    </section>


    <section class="plot-wrap">
      <canvas id="plot" role="img" aria-label="Polar directional wave spectrum"></canvas>
      <div class="map-backdrop" aria-hidden="true"></div>
      <div class="station-map" aria-label="Station map"></div>
      <button class="map-inset-btn" type="button" aria-label="Change station"></button>
      <div id="map-hint" class="map-hint" aria-hidden="true" hidden>
        <span>tap the map<br>to pick a station</span>
        <svg viewBox="0 0 60 50" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M54 4 C 50 26, 32 38, 8 40"/>
          <path d="M19 30 L7 40 L20 47"/>
        </svg>
      </div>
      <button class="map-close" type="button" aria-label="Close map">×</button>
    </section>

    <section class="colorbar" aria-label="Colour key">
      <h2 class="key-title">Energy density <span>(m²/Hz/deg)</span></h2>
      <div id="key" class="key" aria-hidden="true"></div>
      <div id="key-labels" class="key-labels"></div>
      <p id="gap-note" class="gap-note" hidden></p>
    </section>

    <div class="notes">
      <p class="units">Angle = direction waves come <em>from</em><br>Radius = swell period</p>
      <footer>
        Data: <a href="https://cdip.ucsd.edu" rel="noopener">CDIP</a>, Scripps Institution of Oceanography.
        MEM (Lygre &amp; Krogstad 1986). <span id="source-mode"></span>
        Map imagery © Esri, Maxar, Earthstar Geographics.
      </footer>
    </div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
