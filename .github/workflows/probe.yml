name: probe-thredds
on:
  push:
    branches: [claude/cdip-polar-spectrum]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CORS headers
        run: |
          B=https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/realtime
          echo "== GET with Origin =="; curl -sS -D - -o /dev/null -H "Origin: https://cgimber.github.io" "$B/100p1_rt.nc.dds"
          echo "== OPTIONS preflight =="; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://cgimber.github.io" -H "Access-Control-Request-Method: GET" "$B/100p1_rt.nc.dds"
      - name: DDS and DAS
        run: |
          B=https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/realtime
          curl -sS "$B/100p1_rt.nc.dds"
          curl -sS "$B/100p1_rt.nc.das"
      - name: Sample ascii per station
        run: |
          B=https://thredds.cdip.ucsd.edu/thredds/dodsC/cdip/realtime
          for s in 100p1 191p1 220p1 201p1 153p1; do
            echo "===== $s"
            dds=$(curl -sS "$B/${s}_rt.nc.dds")
            echo "$dds" | grep -E "waveTime|waveFrequency =" | head -3
            N=$(echo "$dds" | grep -oE "waveTime\[waveTime = [0-9]+\]" | head -1 | grep -oE "[0-9]+")
            F=$(echo "$dds" | grep -oE "waveFrequency\[waveFrequency = [0-9]+\]" | head -1 | grep -oE "[0-9]+")
            L=$((N-1)); P=$((N-3)); FF=$((F-1))
            curl -gsS "$B/${s}_rt.nc.ascii?waveTime[$P:$L],waveHs[$P:$L],waveTp[$P:$L],waveDp[$P:$L],waveFlagPrimary[$P:$L],waveFrequency[0:$FF],waveBandwidth[0:$FF],waveEnergyDensity[$L][0:$FF],waveA1Value[$L][0:$FF],waveB1Value[$L][0:$FF],waveA2Value[$L][0:$FF],waveB2Value[$L][0:$FF],metaStationName"
            echo
          done
